repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--config, pyproject.toml]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: pyright
        language: python
        additional_dependencies: ["pyright==1.1.414"]
        pass_filenames: false
        types: [python]
      - id: frontend-tsc
        name: frontend tsc
        entry: npm exec --prefix packages/agent-control-frontend -- tsc --noEmit --pretty false
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
