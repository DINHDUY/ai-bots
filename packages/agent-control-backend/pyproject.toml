[project]
name = "agent-control-backend"
version = "0.1.0"
description = "Multi-user control plane for agentbot"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2025.2",
    "httpx>=0.27",
    "agentbot[docker,anthropic,microsoft]",
    "agentbot-product-tools[ufo,open-interface]",
    "agentbot-windows-companion",
    "agentbot-macos-companion",
    "cryptography>=43",
    "fastapi>=0.147.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3,<7",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.19,<2", "azure-ai-ml>=1.35.2,<2", "azure-mgmt-compute>=38.4.0,<39", "azure-mgmt-network>=33.1.0,<34", "azure-keyvault-secrets>=4.9,<5"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "behave>=1.2.6",
    "azure-storage-blob>=12.24",
    "websockets>=17.2",
    "ruff>=0.11",
    "pyright>=1.1.400",
    "pre-commit>=4.7.0",
]

[project.scripts]
agentbot-control = "agentbot_control.app:main"
agentbot-maintenance = "agentbot_control.maintenance:main"
agentbot-backup = "agentbot_control.backup:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbot_control = ["migrations/*.sql"]
