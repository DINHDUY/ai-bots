[project]
name = "agentbot-windows-companion"
version = "0.1.0"
description = "Paired user-session Windows companion for Agent Control and Microsoft UFO"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.1,<3", "websockets>=13,<16", "cryptography>=44", "httpx>=0.27"]

[project.scripts]
agentbot-windows = "agentbot_windows.app:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
