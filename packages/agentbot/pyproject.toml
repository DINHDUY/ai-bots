[project]
name = "agentbot"
version = "0.1.0"
description = "Pluggable multi-framework autonomous agent bot platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gateway = ["fastapi>=0.115", "uvicorn>=0.32"]
docker = ["docker>=7.1"]
anthropic = ["anthropic>=0.49"]
microsoft = ["agent-framework-core>=1.20", "agent-framework-openai>=1.17.0"]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "behave>=1.2.6",
    "azure-storage-blob>=12.24",
    "websockets>=13",
]

[project.scripts]
agentbot = "agentbot.gateway.app:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
