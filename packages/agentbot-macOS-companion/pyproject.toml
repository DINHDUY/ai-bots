[project]
name = "agentbot-macos-companion"
version = "0.1.0"
description = "Owner-paired Open-Interface runtime and UFO TaskStar controller for macOS"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.1,<3", "websockets>=17.2,<18", "httpx>=0.27"]

[project.scripts]
agentbot-macos = "agentbot_macos.app:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

